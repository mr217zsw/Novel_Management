# 小说平台 Nginx 配置（纯 HTTP，ECS 公网 IP 直连，无域名）
# 前端管理后台 + Laravel 后端 API 混合部署
# 部署到 /etc/nginx/sites-available/ 并软链到 sites-enabled/
# 正式上线对接支付/小程序时，需改为 443 + 域名 + HTTPS 证书

server {
    listen 80;
    server_name 8.141.100.90;

    # Laravel 后端 public 目录
    root /var/www/novel-platform/public;
    index index.php;

    # 上传大小限制（OSS 直传不经过服务器，限制可放宽）
    client_max_body_size 10m;

    # ===== 管理后台前端（部署在 public/admin/，构建产物 dist 复制到该目录） =====
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    # ===== API 走 Laravel 后端 =====
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===== 其他动态请求走 Laravel =====
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===== PHP 处理 =====
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # 日志
    access_log /var/log/nginx/novel-api-access.log;
    error_log /var/log/nginx/novel-api-error.log;
}
