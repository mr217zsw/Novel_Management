# 本地开发容器编排（可选）
version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: novel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - novel

  nginx:
    image: nginx:alpine
    container_name: novel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - novel

  mysql:
    image: mysql:8.0
    container_name: novel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: novel_platform
      MYSQL_ROOT_PASSWORD: root123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - novel

  redis:
    image: redis:7-alpine
    container_name: novel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - novel

  queue:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: novel_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --daemon --tries=3
    volumes:
      - ../:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - novel

volumes:
  mysql_data:

networks:
  novel:
