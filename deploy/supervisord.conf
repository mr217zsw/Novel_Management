# Supervisor 配置（生产环境进程管理）
# 部署到 /etc/supervisor/conf.d/novel.conf

[program:novel-queue]
command=php /var/www/novel-platform/artisan queue:work --daemon --tries=3
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/novel-queue.log

[program:novel-scheduler]
command=php /var/www/novel-platform/artisan schedule:work
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/novel-scheduler.log
